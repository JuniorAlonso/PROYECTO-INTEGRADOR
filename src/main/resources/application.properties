spring.application.name=epptrack
server.port=8080

# MySQL (la base "epptrack" se crea sola). Usuario y clave se pueden pasar por variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:epptrack}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Sesión: expira por inactividad y la cookie no es accesible desde JavaScript
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

# Días antes de la fecha de renovación en que un EPP pasa a "por vencer" (RF-09)
app.alertas.dias-por-vencer=15
# Carga datos simulados si la base está vacía
# En un despliegue real poner DATOS_DEMO=false: los usuarios de demostración tienen contraseñas conocidas.
app.datos-demo=${DATOS_DEMO:true}
