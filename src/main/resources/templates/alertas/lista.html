<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Vigencia y alertas · EPPTrack</title></head>
<body>
<section>
    <h1 class="h4 mb-3">Vigencia y alertas</h1>

    <form class="row g-2 mb-3" method="get" th:action="@{/alertas}">
        <input type="hidden" name="estado" th:value="${estado}">
        <div class="col-md-4">
            <select class="form-select" name="sede" onchange="this.form.submit()">
                <option value="">Todas las sedes</option>
                <option th:each="s : ${sedes}" th:value="${s.idSede}" th:text="${s.nombre}"
                        th:selected="${s.idSede == sedeSeleccionada}"></option>
            </select>
        </div>
    </form>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><a class="nav-link" th:classappend="${estado.name() == 'VENCIDO'} ? active"
            th:href="@{/alertas(estado=VENCIDO,sede=${sedeSeleccionada})}">Vencidos <span class="badge text-bg-danger" th:text="${cantVencidos}"></span></a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${estado.name() == 'POR_VENCER'} ? active"
            th:href="@{/alertas(estado=POR_VENCER,sede=${sedeSeleccionada})}">Próximos a vencer <span class="badge text-bg-warning" th:text="${cantPorVencer}"></span></a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${estado.name() == 'VIGENTE'} ? active"
            th:href="@{/alertas(estado=VIGENTE,sede=${sedeSeleccionada})}">Vigentes</a></li>
    </ul>
    <p class="text-muted small">Un EPP pasa a "por vencer" <span th:text="${diasPorVencer}"></span> días antes de su renovación.</p>

    <div class="card"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>Trabajador</th><th>DNI</th><th>Sede</th><th>EPP</th><th>Entrega</th><th>Renovación</th><th>Días</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${filas}" th:with="t=${d.entrega.trabajador}">
                <td th:text="${t.nombreCompleto}"></td>
                <td th:text="${t.dni}"></td>
                <td th:text="${t.sede.nombre}"></td>
                <td th:text="${d.epp.nombre}"></td>
                <td th:text="${#temporals.format(d.entrega.fechaEntrega, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(d.fechaRenovacion, 'dd/MM/yyyy')}"></td>
                <td th:text="${d.diasRestantes}"></td>
                <td><span class="badge" th:classappend="'text-bg-' + ${d.estadoVigencia.color}" th:text="${d.estadoVigencia.etiqueta}"></span></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/entregas/nueva(dni=${t.dni})}">Renovar</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(filas)}"><td colspan="9" class="text-muted">Sin registros en esta categoría.</td></tr>
            </tbody>
        </table>
    </div></div>
</section>
</body>
</html>
