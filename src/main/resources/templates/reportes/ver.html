<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Reporte · EPPTrack</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3 no-imprimir">
        <a th:href="@{/reportes}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Reportes</a>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary btn-sm" data-imprimir>
                <i class="bi bi-printer"></i> Imprimir / PDF</button>
            <a class="btn btn-success btn-sm"
               th:href="@{/reportes/{c}.csv(c=${#strings.replace(reporte.codigo, '-', '')},sede=${param.sede},estado=${param.estado},dias=${param.dias},categoria=${param.categoria},dni=${param.dni},desde=${param.desde},hasta=${param.hasta})}">
                <i class="bi bi-file-earmark-spreadsheet"></i> Excel (CSV)</a>
            <a class="btn btn-success btn-sm"
               th:href="@{/reportes/{c}.xlsx(c=${#strings.replace(reporte.codigo, '-', '')},sede=${param.sede},estado=${param.estado},dias=${param.dias},categoria=${param.categoria},dni=${param.dni},desde=${param.desde},hasta=${param.hasta})}">
                <i class="bi bi-file-earmark-excel"></i> Excel (.xlsx)</a>
        </div>
    </div>

    <div class="card"><div class="card-body">
        <div class="d-flex justify-content-between border-bottom pb-2 mb-3">
            <div>
                <div class="fw-bold" style="color:#16325C">EPPTrack · Campos del Sur S.A.</div>
                <h1 class="h5 mb-0"><span th:text="${reporte.codigo}"></span> · <span th:text="${reporte.titulo}"></span></h1>
            </div>
            <div class="text-end small text-muted">
                Generado el <span th:text="${#temporals.format(generado, 'dd/MM/yyyy HH:mm')}"></span><br>
                por <span th:text="${usuario}"></span>
            </div>
        </div>
        <div class="small text-muted mb-3"><div th:each="l : ${reporte.subtitulo}" th:text="${l}"></div></div>

        <div class="table-responsive"><table class="table table-sm table-striped align-middle">
            <thead class="table-light"><tr><th th:each="c : ${reporte.columnas}" th:text="${c}"></th></tr></thead>
            <tbody>
            <tr th:each="fila : ${reporte.filas}"><td th:each="v : ${fila}" th:text="${v}"></td></tr>
            <tr th:if="${#lists.isEmpty(reporte.filas)}"><td th:colspan="${#lists.size(reporte.columnas)}" class="text-muted">Sin registros para los filtros elegidos.</td></tr>
            </tbody>
        </table></div>
        <div class="small text-muted mt-3" th:text="${pie}"></div>
        <div class="small text-muted"><span th:text="${#lists.size(reporte.filas)}"></span> registro(s)</div>
    </div></div>
</section>
</body>
</html>
