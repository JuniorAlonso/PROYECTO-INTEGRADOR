<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Reportes · EPPTrack</title></head>
<body>
<section>
    <h1 class="h4 mb-3">Reportes</h1>
    <p class="text-muted">Cada reporte se puede ver en pantalla, imprimir o guardar como PDF desde el navegador, y exportar a Excel (CSV).</p>

    <div class="row g-3">
        <div class="col-lg-6"><form class="card h-100" method="get" th:action="@{/reportes/R01}"><div class="card-body">
            <h2 class="h6">R-01 · Cumplimiento de dotación por trabajador</h2>
            <div class="row g-2 mb-3">
                <div class="col"><select class="form-select" name="sede"><option value="">Todas las sedes</option>
                    <option th:each="s : ${sedes}" th:value="${s.idSede}" th:text="${s.nombre}"></option></select></div>
                <div class="col"><select class="form-select" name="estado"><option value="">Todos</option>
                    <option value="COMPLETA">Completa</option><option value="INCOMPLETA">Incompleta</option></select></div>
            </div>
            <button class="btn btn-primary btn-sm">Generar</button>
        </div></form></div>

        <div class="col-lg-6"><form class="card h-100" method="get" th:action="@{/reportes/R02}"><div class="card-body">
            <h2 class="h6">R-02 · Cumplimiento de dotación por sede</h2>
            <div class="row g-2 mb-3">
                <div class="col"><select class="form-select" name="sede"><option value="">Todas las sedes</option>
                    <option th:each="s : ${sedes}" th:value="${s.idSede}" th:text="${s.nombre}"></option></select></div>
            </div>
            <button class="btn btn-primary btn-sm">Generar</button>
        </div></form></div>

        <div class="col-lg-6"><form class="card h-100" method="get" th:action="@{/reportes/R03}"><div class="card-body">
            <h2 class="h6">R-03 · Vigencias y renovaciones de EPP</h2>
            <div class="row g-2 mb-3">
                <div class="col"><select class="form-select" name="sede"><option value="">Todas las sedes</option>
                    <option th:each="s : ${sedes}" th:value="${s.idSede}" th:text="${s.nombre}"></option></select></div>
                <div class="col"><select class="form-select" name="categoria"><option value="">Todas las categorías</option>
                    <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"></option></select></div>
                <div class="col-3"><input class="form-control" type="number" name="dias" value="30" min="0" max="3650" title="Días"></div>
            </div>
            <button class="btn btn-primary btn-sm">Generar</button>
        </div></form></div>

        <div class="col-lg-6"><form class="card h-100" method="get" th:action="@{/reportes/R04}"><div class="card-body">
            <h2 class="h6">R-04 · Constancia de entrega por trabajador</h2>
            <div class="row g-2 mb-3">
                <div class="col"><input class="form-control" name="dni" maxlength="8" placeholder="DNI" required></div>
                <div class="col"><input class="form-control" type="date" name="desde" title="Desde"></div>
                <div class="col"><input class="form-control" type="date" name="hasta" title="Hasta"></div>
            </div>
            <button class="btn btn-primary btn-sm">Generar</button>
        </div></form></div>
    </div>
</section>
</body>
</html>
