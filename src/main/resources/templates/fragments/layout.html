<!DOCTYPE html>
<html lang="es" th:fragment="layout(title, content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">EPPTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/epptrack.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar p-3 flex-shrink-0">
        <div class="marca mb-4"><i class="bi bi-shield-check"></i> EPPTrack</div>
        <ul class="nav flex-column gap-1">
            <li><a class="nav-link" th:classappend="${rutaActual == '/'} ? active" th:href="@{/}">
                <i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a class="nav-link" th:classappend="${#strings.startsWith(rutaActual, '/trabajadores')} ? active" th:href="@{/trabajadores}">
                <i class="bi bi-people"></i> Trabajadores</a></li>
            <li><a class="nav-link" th:classappend="${#strings.startsWith(rutaActual, '/epp')} ? active" th:href="@{/epp}">
                <i class="bi bi-cone-striped"></i> Catálogo de EPP</a></li>
            <li><a class="nav-link" th:classappend="${#strings.startsWith(rutaActual, '/matriz')} ? active" th:href="@{/matriz}">
                <i class="bi bi-grid-3x3"></i> Matriz de asignación</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','SUPERVISOR')"><a class="nav-link" th:classappend="${#strings.startsWith(rutaActual, '/entregas')} ? active" th:href="@{/entregas/nueva}">
                <i class="bi bi-box-seam"></i> Registro de entregas</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','SUPERVISOR')"><a class="nav-link" th:classappend="${#strings.startsWith(rutaActual, '/alertas')} ? active" th:href="@{/alertas}">
                <i class="bi bi-bell"></i> Vigencia y alertas</a></li>
            <li><a class="nav-link" th:classappend="${#strings.startsWith(rutaActual, '/historial')} ? active" th:href="@{/historial}">
                <i class="bi bi-clock-history"></i> Historial</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','SUPERVISOR')"><a class="nav-link" th:classappend="${#strings.startsWith(rutaActual, '/reportes')} ? active" th:href="@{/reportes}">
                <i class="bi bi-file-earmark-text"></i> Reportes</a></li>
        </ul>
    </nav>

    <div class="flex-grow-1">
        <header class="bg-white border-bottom px-4 py-2 d-flex justify-content-end align-items-center gap-3">
            <span class="text-muted small">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name">usuario</span>
                (<span sec:authentication="principal.authorities">rol</span>)
            </span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-secondary">Salir</button>
            </form>
        </header>
        <main class="p-4">
            <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
