<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Catálogo de EPP · EPPTrack</title></head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 encabezado-pagina">
        <div><h1 class="h4 mb-0">Catálogo de EPP</h1>
            <p class="subtitulo mb-0">Los equipos que existen y cuántos días dura cada uno antes de renovarse.</p></div>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/epp/nuevo}">
            <i class="bi bi-plus-lg"></i> Nuevo EPP</a>
    </div>

    <form class="row g-2 mb-3" method="get">
        <div class="col-md-4">
            <select class="form-select" name="categoria" aria-label="Filtrar por categoría" data-autosubmit>
                <option value="">Todas las categorías</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"
                        th:selected="${c.idCategoria == categoriaSeleccionada}"></option>
            </select>
        </div>
    </form>

    <div class="mb-3 buscador"><i class="bi bi-search"></i><input type="search" class="form-control" data-filtrar="tbody tr" placeholder="Buscar equipo por nombre o categoría…" aria-label="Buscar equipo"></div>
    <div class="card"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>EPP</th><th>Clase</th><th class="text-end" title="Vida útil en días">Vida útil</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${epps}" th:classappend="${!e.activo} ? 'text-muted'">
                <td>
                    <div class="fw-semibold" th:text="${e.nombre}"></div>
                    <div class="small text-muted"><span th:text="${e.categoria.nombre}"></span><span th:if="${e.descripcion != null and !e.descripcion.isBlank()}"> · <span th:text="${e.descripcion}"></span></span></div>
                </td>
                <td>
                    <span th:text="${e.claseEfectiva.etiqueta}"></span>
                    <span th:if="${e.clasePendienteValidacion}" class="estado estado-alerta"
                          title="SST aún no confirmó la clase ni la política de devolución de este EPP"><i class="bi bi-hourglass-split"></i> Pendiente de validación</span>
                </td>
                <td class="text-end text-nowrap"><span th:text="${e.vidaUtilDias}"></span> <span class="text-muted small">días</span></td>
                <td><span class="estado" th:classappend="${e.activo} ? 'estado-ok' : 'estado-neutro'"><i class="bi" th:classappend="${e.activo} ? 'bi-check-circle' : 'bi-slash-circle'" aria-hidden="true"></i><span th:text="${e.activo} ? 'Activo' : 'Inactivo'"></span></span></td>
                <td class="text-end" sec:authorize="hasRole('ADMIN')">
                    <div class="d-flex flex-column flex-xl-row gap-1 align-items-end justify-content-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/epp/{id}/editar(id=${e.idEpp})}"><i class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
                        <form class="d-inline" method="post" th:action="@{/epp/{id}/estado(id=${e.idEpp})}">
                            <button class="btn btn-sm btn-outline-secondary" th:text="${e.activo} ? 'Desactivar' : 'Activar'"></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div></div>
</section>
</body>
</html>
