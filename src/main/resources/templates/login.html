<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · EPPTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/epptrack.css}">
</head>
<body class="login-fondo d-flex align-items-center justify-content-center">
<div class="card shadow" style="width: 380px">
    <div class="card-body p-4">
        <h1 class="h4 mb-1"><i class="bi bi-shield-check text-primary"></i> EPPTrack</h1>
        <p class="text-muted small mb-4">Trazabilidad y seguimiento de EPP · Campos del Sur S.A.</p>

        <div th:if="${param.error}" class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
        <div th:if="${param.salir}" class="alert alert-info py-2">Sesión cerrada.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-primary w-100">Ingresar</button>
        </form>
    </div>
</div>
</body>
</html>
