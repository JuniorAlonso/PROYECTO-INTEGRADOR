<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Códigos de EPP · EPPTrack</title></head>
<body>
<section>
    <div class="mb-3 encabezado-pagina">
        <h1 class="h4 mb-1"><i class="bi bi-upc-scan"></i> Códigos de EPP</h1>
        <p class="subtitulo">Cada unidad física tiene un código de identificación. Busca uno para ver por quién pasó y qué le ocurrió.</p>
    </div>
    <div class="card card-body mb-3">
        <div class="row g-2">
            <form class="col-md-4 d-flex gap-2" method="get" th:action="@{/inventario/unidades}">
                <input class="form-control cod" name="codigo" placeholder="EPP-003-0001" aria-label="Código" required>
                <button class="btn btn-primary" aria-label="Buscar por código"><i class="bi bi-search"></i></button>
            </form>
            <form class="col-md-8 d-flex gap-2" method="get" th:action="@{/inventario/unidades}">
                <select class="form-select" name="epp" data-autosubmit aria-label="EPP">
                    <option value="">Todos los EPP</option>
                    <option th:each="e : ${epps}" th:value="${e.idEpp}" th:text="${e.nombre}" th:selected="${e.idEpp == eppSeleccionado}"></option>
                </select>
                <select class="form-select" name="estado" data-autosubmit aria-label="Estado">
                    <option value="">Todos los estados</option>
                    <option th:each="s : ${estados}" th:value="${s}" th:text="${s.etiqueta}" th:selected="${s == estadoSeleccionado}"></option>
                </select>
            </form>
        </div>
    </div>
    <div class="card"><div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Código</th><th>EPP</th><th>Estado</th><th>Condición</th><th>En poder de</th><th>Ingreso</th><th class="text-end">Reparaciones</th></tr></thead>
            <tbody>
            <tr th:each="u : ${unidades}">
                <td><a class="cod fw-semibold" th:href="@{/inventario/unidad/{id}(id=${u.idUnidad})}" th:text="${u.codigo}"></a></td>
                <td th:text="${u.epp.nombre}"></td>
                <td><span class="badge" th:classappend="'text-bg-' + ${u.estado.color}" th:text="${u.estado.etiqueta}"></span>
                    <span th:if="${u.pendienteDevolucion}" class="estado estado-alerta"><i class="bi bi-arrow-return-left" aria-hidden="true"></i>Por devolver</span></td>
                <td class="small" th:text="${u.condicion.etiqueta}"></td>
                <td><a th:if="${u.trabajador != null}" th:href="@{/historial(dni=${u.trabajador.dni})}" th:text="${u.trabajador.nombreCompleto}"></a>
                    <span th:if="${u.trabajador == null}" class="text-muted">—</span></td>
                <td class="small" th:text="${#temporals.format(u.fechaIngreso, 'dd/MM/yyyy')}"></td>
                <td class="text-end cod" th:text="${u.vecesReparado}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(unidades)}"><td colspan="7" class="vacio">No hay unidades con ese filtro.</td></tr>
            </tbody>
        </table>
    </div></div>
</section>
</body>
</html>
