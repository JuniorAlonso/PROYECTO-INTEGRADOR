<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · EPPTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/bricolage-grotesque@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/figtree@5/index.css">
    <link rel="stylesheet" th:href="@{/css/epptrack.css}">
</head>
<body>
<main class="login-form" style="min-height: 100vh">
    <div class="card"><div class="card-body p-4 p-md-5 text-center">
        <i class="bi bi-exclamation-octagon display-4 text-danger" aria-hidden="true"></i>
        <h1 class="h4 mt-2" th:text="${status == 404} ? 'No encontramos lo que buscas' : (${status == 403} ? 'No tienes permiso' : 'Algo salió mal')">Algo salió mal</h1>
        <p class="estado estado-neutro" th:if="${status}">Código <span th:text="${status}">500</span></p>
        <p class="text-muted" th:text="${mensaje} ?: (${status} == 404 ? 'La página o el registro no existe.' : (${status} == 403 ? 'Tu rol no permite esta acción. Si la necesitas, consulta con el administrador.' : 'Ocurrió un error inesperado. Intenta de nuevo; si persiste, avisa al administrador.'))"></p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house"></i> Volver al inicio</a>
        </div>
    </div></div>
</main>
</body>
</html>
